name: Release Build

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --release --verbose

    - name: Strip binary
      run: strip target/release/scatac-barcode-splitter

    - name: Create archive
      run: |
        cd target/release
        tar czf scatac-barcode-splitter-linux-x86_64.tar.gz scatac-barcode-splitter
        sha256sum scatac-barcode-splitter-linux-x86_64.tar.gz > scatac-barcode-splitter-linux-x86_64.tar.gz.sha256

    - name: Upload release assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/release/scatac-barcode-splitter-linux-x86_64.tar.gz
          target/release/scatac-barcode-splitter-linux-x86_64.tar.gz.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scatac-barcode-splitter-linux-x86_64
        path: |
          target/release/scatac-barcode-splitter-linux-x86_64.tar.gz
          target/release/scatac-barcode-splitter-linux-x86_64.tar.gz.sha256
        retention-days: 7
